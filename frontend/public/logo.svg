<svg viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Claude 2026-10-14: Lubber dock-sign mark (replaces cinema ticket).
       Reason: landside identity — pilings, brass rivets, rope — while the
         SAK MEDIA SERVER wordmark stays until the release rename.
       Troubleshooting: auth screen is the only full-logo moment (AuthScreen).
       Review if: the product is renamed from SAK. -->

  <!-- sign board -->
  <rect x="40" y="90" width="620" height="280" rx="10" fill="#E6DFD2" stroke="#1A2C30" stroke-width="3"/>

  <!-- brass corner rivets -->
  <g fill="#C9A43A" stroke="#1A2C30" stroke-width="1.25">
    <circle cx="62" cy="112" r="7"/>
    <circle cx="638" cy="112" r="7"/>
    <circle cx="62" cy="348" r="7"/>
    <circle cx="638" cy="348" r="7"/>
  </g>

  <!-- timber seam + left pier bay -->
  <line x1="190" y1="90" x2="190" y2="370" stroke="#1A2C30" stroke-width="2"/>

  <!-- pilings -->
  <rect x="76" y="128" width="24" height="168" rx="3" fill="#1A2C30"/>
  <rect x="118" y="148" width="24" height="148" rx="3" fill="#173036"/>
  <ellipse cx="88" cy="128" rx="15" ry="6" fill="#C9A43A"/>
  <ellipse cx="130" cy="148" rx="15" ry="6" fill="#C9A43A"/>

  <!-- rope hitch between pilings -->
  <path d="M88 200 C 88 236, 130 236, 130 272" fill="none" stroke="#B49D78" stroke-width="5" stroke-linecap="round"/>
  <path d="M88 220 C 108 220, 108 240, 88 240" fill="none" stroke="#B49D78" stroke-width="3" stroke-linecap="round"/>

  <text x="115" y="332" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="13" letter-spacing="1" fill="#1A2C30">DRY DOCK</text>

  <!-- landside banner -->
  <rect x="230" y="108" width="380" height="28" fill="#B24332"/>
  <text x="420" y="127" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="14" letter-spacing="6" fill="#E6DFD2">LANDSIDE</text>

  <!-- wordmark — SAK until release rename -->
  <text x="420" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="60" letter-spacing="1" fill="#1A2C30">SAK MEDIA</text>
  <text x="420" y="278" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="10" fill="#B24332">SERVER</text>

  <text x="610" y="352" text-anchor="end" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#5F6D69">NO. 000001</text>
  <text x="230" y="352" text-anchor="start" font-family="'Courier New', monospace" font-size="12" letter-spacing="1" fill="#5F6D69">GOOD FOR ONE STREAM, ANY SCREEN</text>
</svg>
