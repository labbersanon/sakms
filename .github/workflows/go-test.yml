# Claude 2026-08-04: Go unit tests against Postgres (SQLite removed from sakms).
# Reason: WS5.5 — SAKMS_TEST_DATABASE_URL required; schema via dbtest template DB.
# Troubleshooting: failures often mean missing GREATEST/bool coerce / baseline drift.
# Review if: compose Postgres major version changes from 16.
name: go-test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sakms
          POSTGRES_PASSWORD: sakms
          POSTGRES_DB: sakms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sakms -d sakms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SAKMS_TEST_DATABASE_URL: postgres://sakms:sakms@localhost:5432/sakms_test?sslmode=disable
      SAKMS_TEST_DATABASE_URL_REQUIRED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      # Claude 2026-08-07: install glfw's Linux build deps (cmd/sakms-node-config)
      # Reason: go-gl/glfw (indirect dep, packaging/rpm/sakms-node.spec's
      #   BuildRequires list is the authoritative source) needs X11/Wayland
      #   dev headers to compile via CGO — go test ./... builds every
      #   package including this GUI tool, so without these the whole run
      #   fails at compile time regardless of any Go change, headless
      #   runner or not (this is a build-time need, not a display need).
      # Troubleshooting: "wayland-client-core.h: No such file or directory"
      #   or similar X11/GL header errors mean this step didn't run or a
      #   package name drifted from Ubuntu's current apt repos.
      # Review if: packaging/rpm/sakms-node.spec's BuildRequires list
      #   changes — keep this apt-get list in lockstep (Fedora pkg name ->
      #   Debian/Ubuntu equivalent).
      - name: Install glfw build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxi-dev libxxf86vm-dev libgl1-mesa-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Claude 2026-08-07: build the frontend before go test
      # Reason: internal/web/web.go's //go:embed static fails cleanly on a
      #   clean checkout (static/ is gitignored, only pnpm build populates
      #   it — see that file's own doc comment) — this workflow never had
      #   the build step the Dockerfile's frontend stage does, so cmd/sakms
      #   and internal/web always failed here regardless of any Go change.
      # Troubleshooting: "pattern static: no matching files found" in the
      #   go test log means this step didn't run or its output path drifted.
      # Review if: Dockerfile's frontend stage (Node/pnpm version, build
      #   command, or output path) changes — keep this step in lockstep.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build frontend (populates internal/web/static)
        working-directory: frontend
        run: pnpm build
      - name: go test
        run: go test -count=1 -timeout 45m -p 4 ./...
